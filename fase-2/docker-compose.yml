# docker-compose.yml
# Autores: Ernesto eta Urtzi
services:
  app: # Servicio web principal (PHP + Apache)
    build:
      context: . # Contexto de build: carpeta fase-2
      dockerfile: docker/php/Dockerfile # Imagen personalizada de PHP con extensiones PDO/MySQL
    container_name: imaw_fase2_app # Nombre fijo del contenedor de aplicacion
    ports:
      - "8082:80" # Puerto local 8082 -> puerto 80 de Apache en contenedor
    volumes:
      - ./src:/var/www/html # Monta el codigo local para desarrollo en caliente
    depends_on:
      - db # Arranca la app despues del servicio de base de datos

  db: # Servicio de base de datos MySQL
    image: mysql:8.4 # Imagen oficial de MySQL 8.4
    container_name: imaw_fase2_mysql
    restart: unless-stopped # Reinicio automatico salvo parada manual
    environment:
      MYSQL_ROOT_PASSWORD: root # Clave del usuario root (entorno docente)
      MYSQL_DATABASE: imaw # Base de datos inicial
      MYSQL_USER: imaw # Usuario de aplicacion
      MYSQL_PASSWORD: imaw # Clave del usuario de aplicacion
    ports:
      - "3307:3306" # Puerto local 3307 -> puerto 3306 de MySQL
    volumes:
      - db_data:/var/lib/mysql # Persistencia de datos de MySQL
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro # Script SQL inicial al crear la BD

  phpmyadmin: # Interfaz web para administrar MySQL
    image: phpmyadmin:latest
    container_name: imaw_fase2_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db # Host interno de la BD (nombre del servicio)
      PMA_PORT: 3306 # Puerto interno de MySQL en la red Docker
    ports:
      - "8083:80" # Acceso web a phpMyAdmin
    depends_on:
      - db

  composer: # Herramienta para ejecutar Composer sin instalarlo en Windows
    image: composer:2
    container_name: imaw_fase2_composer
    working_dir: /app # Directorio de trabajo dentro del contenedor
    volumes:
      - ./:/app # Monta todo el proyecto para composer.json y vendor
    profiles:
      - tools # Se usa bajo demanda (docker compose run --rm composer ...)

volumes:
  db_data: # Volumen nombrado para conservar datos de MySQL